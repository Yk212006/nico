[project]
name = "nico"
version = "0.2.0"
description = "NICO — A modular AI assistant for Raspberry Pi, desktop Linux, and Windows"
readme = "README_NICO.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Development and testing
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
nico = "nico.cli:main"
nico-local = "nico.local_launcher:main"
nico-desktop = "nico.desktop_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nico", "friday"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["nico/tests"]

[tool.coverage.run]
source = ["nico"]
omit = ["nico/tests/*"]
